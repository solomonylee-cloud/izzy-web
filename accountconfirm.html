<!doctype html>
<html lang="en"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Confirm your Izzy account</title>
<meta name="referrer" content="strict-origin">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Quicksand:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css">
<style>.confirm-wrap{max-width:460px;margin:12vh auto;padding:24px;text-align:center}
.confirm-wrap,.confirm-wrap h1,.confirm-wrap p,.confirm-wrap a{font-family:'Quicksand',ui-rounded,system-ui,sans-serif}
.confirm-logo{width:76px;height:76px;border-radius:20px;margin:0 auto 20px;display:block;box-shadow:0 8px 28px rgba(0,0,0,.35)}
.confirm-wrap h1{margin:.4em 0;font-weight:700}.confirm-btn{display:inline-block;margin-top:20px;padding:14px 28px;border-radius:999px;background:#1B426B;color:#fff;text-decoration:none;font-weight:700}
.muted{opacity:.7;font-size:14px;font-weight:500}</style>
</head><body>
<div class="confirm-wrap" id="wrap">
  <img class="confirm-logo" src="assets/app-icon.png" alt="Izzy">
  <h1 id="title">Confirming…</h1>
  <p id="msg" class="muted">One moment while we confirm your account.</p>
  <form id="resetForm" style="display:none;margin-top:16px;text-align:left" autocomplete="off">
    <label class="muted" for="pw1">New password</label>
    <input id="pw1" type="password" minlength="6" autocomplete="new-password" required style="width:100%;padding:12px 14px;margin:6px 0 14px;border-radius:12px;border:1px solid #cbd5e0;font-size:16px">
    <label class="muted" for="pw2">Confirm password</label>
    <input id="pw2" type="password" minlength="6" autocomplete="new-password" required style="width:100%;padding:12px 14px;margin:6px 0 8px;border-radius:12px;border:1px solid #cbd5e0;font-size:16px">
    <p id="formErr" class="muted" style="color:#DC2626;min-height:18px"></p>
    <button id="saveBtn" type="submit" class="confirm-btn" style="border:0;cursor:pointer;width:100%">Save password</button>
  </form>
  <a id="openApp" class="confirm-btn" style="display:none" href="#">Open Izzy</a>
</div>
<!-- Vendored @supabase/supabase-js@2.110.7 UMD build (official npm dist/umd/supabase.js,
     tarball sha512 verified against the npm registry's published dist.integrity before
     vendoring — see commit message). Same-origin, no third-party fetch, no floating version. -->
<script src="vendor/supabase-js@2.110.7.umd.js"></script>
<script type="module">
const { createClient } = window.supabase; // from the vendored UMD script above
const PROJECTS = {
  prod:    { url: 'https://jfafstzpurlgpyrfoheg.supabase.co', anon: 'sb_publishable_eTyWJE4lS_74Ek7JDtwvIA_rQ7dj9mU' },
  staging: { url: 'https://kncotpbwcaqtqgnksiue.supabase.co', anon: 'sb_publishable_w4d48K0MtUuvOyULYmCLJA_gl9_j25U' },
};
const p = new URLSearchParams(location.search);
const token_hash = p.get('token_hash');
const type = p.get('type') || 'signup';
const projectKey = p.get('project');
// Object.hasOwn, not PROJECTS[key] truthiness: a `?project=constructor` (or __proto__,
// toString, …) resolves on the prototype chain and would read as a known project.
const project = (projectKey && Object.prototype.hasOwnProperty.call(PROJECTS, projectKey)) ? projectKey : 'prod';
const title = document.getElementById('title'), msg = document.getElementById('msg'), openApp = document.getElementById('openApp');
(async () => {
  if (!token_hash) { title.textContent = 'Link incomplete'; msg.textContent = 'This confirmation link is missing its token. Request a new email from the app.'; return; }

  // DEEP LINK FIRST, store only as a fallback.
  //
  // Whoever taps this just created their account INSIDE the app, so they
  // already have it installed — a store page is the wrong destination for the
  // overwhelmingly common case. It was also, as of 2026-07-26, a DEAD
  // destination on BOTH platforms: there is no Play listing yet, and
  // apps.apple.com/app/id6761801986 is an App Store Connect record for an app
  // that has not shipped, so it returns "App Not Available". Sending a user who
  // has the app to a 404 for an app they already own is the worst of both.
  //
  // `skibuddy://` is the production scheme registered in the app
  // (SkiBuddyGemini app.json "scheme"; routes in App.tsx deepLinkConfig).
  // Opening it hands off to the app if installed and does nothing visible if
  // not — which is why the store fallback below is still needed.
  //
  // Hoisted here (before the verifyOtp try/catch below) so the button is fully
  // wired — real href, click handler — regardless of which branch reveals it:
  // signup success, the error/expired-link path, or the recovery form's
  // save-success handler. Only `openApp.style.display` toggling stays
  // per-branch; the wiring itself must not depend on which branch runs.
  const STORE_URL = /Android/i.test(navigator.userAgent)
    ? 'https://play.google.com/store/apps/details?id=com.solomonylee.SkiBuddyGemini'
    : 'https://apps.apple.com/app/id6761801986';

  // Keep a real href so the control stays a working link for keyboard users,
  // middle-click, and any browser that blocks the scripted scheme handoff.
  openApp.href = STORE_URL;

  openApp.addEventListener('click', (ev) => {
    ev.preventDefault();
    // If the scheme handoff succeeds the browser is backgrounded, so this page
    // is hidden by the time the timer fires — that is the signal to NOT bounce
    // the user to a store they do not need. pagehide covers Safari, which can
    // background without firing visibilitychange.
    let handedOff = false;
    const markHandedOff = () => { handedOff = true; };
    document.addEventListener('visibilitychange', () => { if (document.hidden) markHandedOff(); }, { once: true });
    window.addEventListener('pagehide', markHandedOff, { once: true });

    window.location.href = 'skibuddy://';

    // 1200ms: long enough for the OS scheme prompt/handoff on a slow device,
    // short enough not to feel broken when the app genuinely is not installed.
    window.setTimeout(() => {
      if (!handedOff && !document.hidden) window.location.href = STORE_URL;
    }, 1200);
  });

  try {
    const { url, anon } = PROJECTS[project];
    // persistSession/autoRefreshToken/detectSessionInUrl all default to true in
    // the vendored client, which would let a crafted #access_token=... fragment
    // plant a session in this origin's localStorage on page load. This page
    // never reads a session back on the signup path — it only calls verifyOtp()
    // below with the token_hash it parsed from the query string — so none of
    // those defaults are needed there, and disabling them closes that off.
    // detectSessionInUrl only gates the client's own automatic URL-scanning
    // during construction; it has no effect on the explicit verifyOtp() call.
    // The recovery branch below relies on the same client: its verifyOtp runs
    // inside the SUBMIT handler (not on load — see that branch), and the session
    // it returns is held in memory only, then signed out once the password is
    // saved. No explicit setSession is needed: verifyOtp already installs the
    // session it minted on this client instance.
    const supabase = createClient(url, anon, {
      auth: { persistSession: false, autoRefreshToken: false, detectSessionInUrl: false },
    });
    if (type === 'recovery') {
      // 🔴 DO NOT verifyOtp ON LOAD for a recovery link. A recovery token is
      // SINGLE-USE and is spent the moment verifyOtp runs, so verifying here
      // meant: a reload or a back-navigation spent the token with no password
      // ever set (and no way back except requesting another email), and a
      // failing session install painted "Link expired" over a form the user
      // could still see and type into. The token is spent inside the submit
      // handler instead — one tap, one spend, immediately followed by the
      // updateUser it exists for.
      //
      // If the Universal Link had reached the app this page would never have
      // loaded, so this IS the fallback path (Gmail webview, desktop, no app).
      document.title = 'Reset your Izzy password';
      title.textContent = 'Choose a new password';
      msg.textContent = 'At least 6 characters.';
      const form = document.getElementById('resetForm'), pw1 = document.getElementById('pw1'),
            pw2 = document.getElementById('pw2'), formErr = document.getElementById('formErr'),
            saveBtn = document.getElementById('saveBtn');
      // Attach the submit listener before the form is ever shown, so a submit
      // can never fall through to a native (unhandled) form submission.
      //
      // The token is single-use, but updateUser can still fail after a
      // successful verify (GoTrue same_password/weak_password, a network
      // throw). That re-enables the Save button, and a retry must NOT
      // re-spend the already-consumed token — that would paint "Link
      // expired" over a page that still holds a perfectly good in-memory
      // session. `verified` makes the verifyOtp call run at most once.
      let verified = false;
      form.addEventListener('submit', async (ev) => {
        ev.preventDefault();
        formErr.textContent = '';
        if (pw1.value.trim().length === 0) { formErr.textContent = 'Enter a new password.'; return; }
        if (pw1.value.length < 6) { formErr.textContent = 'Use at least 6 characters.'; return; }
        if (pw1.value !== pw2.value) { formErr.textContent = "Passwords don't match yet."; return; }
        saveBtn.disabled = true;
        try {
          if (!verified) {
            // Spend the token HERE — the client holds the resulting session in
            // memory (persistSession:false) for the updateUser immediately below.
            const { error: vErr } = await supabase.auth.verifyOtp({ type, token_hash });
            if (vErr) {
              // Now — and only now — is "expired" the right thing to say. Hide
              // the form so no one is left typing into a dead one. `verified`
              // stays false, matching today's behavior on a failed verify.
              form.style.display = 'none';
              title.textContent = 'Link expired';
              msg.textContent = 'This reset link has already been used or expired. Open Izzy, tap "Forgot password?" and request a new one.';
              openApp.style.display = 'inline-block';
              return;
            }
            verified = true;
          }
          const { error: upErr } = await supabase.auth.updateUser({ password: pw1.value });
          if (upErr) { formErr.textContent = upErr.message; saveBtn.disabled = false; return; }
          // Show success immediately — don't gate it on signOut, which is
          // fire-and-forget below. This page only ever held an in-memory
          // session (persistSession:false), so nothing persists either way.
          form.style.display = 'none';
          title.textContent = '✅ Password updated';
          msg.textContent = 'Open Izzy and sign in with your new password.';
          openApp.style.display = 'inline-block';
          supabase.auth.signOut().catch(() => {});
        } catch (e) {
          formErr.textContent = 'Something went wrong. Try again.';
          saveBtn.disabled = false;
        }
      });
      form.style.display = 'block';
      return; // do not show the Open-app button until the password is saved
    }

    const { data, error } = await supabase.auth.verifyOtp({ type, token_hash });
    if (error) throw error;

    title.textContent = '✅ Email confirmed!';
    msg.textContent = 'Your Izzy account is verified. Open the app to log in.';
  } catch (e) {
    title.textContent = 'Link expired';
    msg.textContent = type === 'recovery'
      ? 'This reset link has already been used or expired. Open Izzy, tap "Forgot password?" and request a new one.'
      : 'This confirmation link has already been used or expired. Open Izzy and request a new one.';
  }
  openApp.style.display = 'inline-block';
})();
</script>
</body></html>
